[project]
name = "etf-pressure-lab"
version = "0.1.0"
description = "Does off-exchange short-sale activity improve ETF rebound predictions?"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "pyarrow>=18,<24",
  "scikit-learn>=1.6,<2", "yfinance>=0.2.65,<1",
  "requests>=2.32,<3", "streamlit>=1.45,<2", "plotly>=6,<7",
  "exchange-calendars>=4.8,<5", "nbformat>=5.10,<6"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "playwright>=1.50", "nbclient>=0.10", "ipykernel>=6"]
[project.scripts]
etf-pressure = "etf_pressure.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/etf_pressure"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
