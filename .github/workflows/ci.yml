name: Research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/audit_publication.py
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.9"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - run: uv run ruff check src tests scripts app.py
      - run: uv run pytest -q
